name: docs-build

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - docs/update

permissions:
  contents: read

jobs:
  build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Validate Worker deployment bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
