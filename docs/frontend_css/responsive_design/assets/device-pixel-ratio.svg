<svg viewBox="0 0 720 340" width="720" height="340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- titles -->
  <text x="160" y="44" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">DPR = 1 · 标准屏</text>
  <text x="560" y="44" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">DPR = 2 · 高清屏（Retina）</text>

  <!-- highlighted CSS pixel (same logical pixel on both sides) -->
  <rect x="70" y="70" width="60" height="60" fill="#dbeafe"/>
  <rect x="470" y="70" width="60" height="60" fill="#dbeafe"/>

  <!-- LEFT grid: 1 CSS 像素 = 1 物理像素 -->
  <g stroke="#334155" stroke-width="2" shape-rendering="crispEdges">
    <line x1="70" y1="70" x2="70" y2="250"/>
    <line x1="130" y1="70" x2="130" y2="250"/>
    <line x1="190" y1="70" x2="190" y2="250"/>
    <line x1="250" y1="70" x2="250" y2="250"/>
    <line x1="70" y1="70" x2="250" y2="70"/>
    <line x1="70" y1="130" x2="250" y2="130"/>
    <line x1="70" y1="190" x2="250" y2="190"/>
    <line x1="70" y1="250" x2="250" y2="250"/>
  </g>

  <!-- RIGHT grid: thin device-pixel sub-lines (each CSS px split 2x2) -->
  <g stroke="#9aa4b2" stroke-width="1" shape-rendering="crispEdges">
    <line x1="500" y1="70" x2="500" y2="250"/>
    <line x1="560" y1="70" x2="560" y2="250"/>
    <line x1="620" y1="70" x2="620" y2="250"/>
    <line x1="470" y1="100" x2="650" y2="100"/>
    <line x1="470" y1="160" x2="650" y2="160"/>
    <line x1="470" y1="220" x2="650" y2="220"/>
  </g>
  <!-- RIGHT grid: thick CSS-pixel boundaries -->
  <g stroke="#334155" stroke-width="2.2" shape-rendering="crispEdges">
    <line x1="470" y1="70" x2="470" y2="250"/>
    <line x1="530" y1="70" x2="530" y2="250"/>
    <line x1="590" y1="70" x2="590" y2="250"/>
    <line x1="650" y1="70" x2="650" y2="250"/>
    <line x1="470" y1="70" x2="650" y2="70"/>
    <line x1="470" y1="130" x2="650" y2="130"/>
    <line x1="470" y1="190" x2="650" y2="190"/>
    <line x1="470" y1="250" x2="650" y2="250"/>
  </g>

  <!-- arrow between panels -->
  <g stroke="#94a3b8" stroke-width="2" fill="#94a3b8">
    <line x1="290" y1="160" x2="420" y2="160"/>
    <polygon points="420,160 408,153 408,167" stroke="none"/>
  </g>
  <text x="355" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">像素翻倍</text>

  <!-- captions -->
  <text x="160" y="282" text-anchor="middle" font-size="15" fill="#1f2937">1 CSS 像素 = 1 物理像素</text>
  <text x="560" y="282" text-anchor="middle" font-size="15" fill="#1f2937">1 CSS 像素 = 4 物理像素（2×2）</text>
  <text x="360" y="314" text-anchor="middle" font-size="13" fill="#64748b">蓝色高亮是同一个 CSS 像素：右侧它被 4 个物理像素渲染，所以更精细</text>
</svg>
